name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, analyze, test, publish dry-run, pana
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib example/test example/integration_test example/test_driver
      - run: flutter analyze
      # Golden images are checked on a pinned Flutter in their own job.
      - run: flutter test --exclude-tags golden
      - name: Example
        working-directory: example
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - run: dart pub publish --dry-run
      - name: pana
        run: |
          sudo apt-get install -y webp
          dart pub global activate pana
          dart pub global run pana --no-warning --exit-code-threshold 0 .

  goldens:
    name: Golden images (Flutter 3.47.9, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Text rasterises a little differently from one Flutter to the next, so
      # the goldens are rendered and checked on one version. Update it, and
      # the goldens with `flutter test --tags golden --update-goldens`, in the
      # same pull request.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --tags golden
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: test/failures/

  min-flutter:
    name: Tests on the oldest supported Flutter (3.32.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --exclude-tags golden

  tests:
    name: Tests on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --exclude-tags golden

  web-tests:
    name: Tests in Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # The browser has no environment for skullet to spot a test run in.
      - run: flutter test --platform chrome --dart-define=SKULLET_TEST=true --exclude-tags golden

  api:
    name: Public API against the last release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub global activate dart_apitool
      # Fails when the API breaks without the version saying so (a minor
      # bump before 1.0, a major one after).
      - run: |
          LATEST=$(curl -s https://pub.dev/api/packages/skullet | jq -r .latest.version)
          dart pub global run dart_apitool:main diff --old "pub://skullet/$LATEST" --new . --version-check-mode=onlyBreakingChanges

  integration:
    name: Integration (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: android, os: ubuntu-latest }
          - { target: ios, os: macos-latest }
          - { target: macos, os: macos-latest }
          - { target: windows, os: windows-latest }
          - { target: linux, os: ubuntu-latest }
          - { target: web, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Android emulator
        if: matrix.target == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
        working-directory: .
      - if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - if: matrix.target == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: example
          script: flutter test integration_test -d emulator-5554

      - name: iOS simulator
        if: matrix.target == 'ios'
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone"))][0].udid')
          xcrun simctl boot "$UDID"
          flutter test integration_test -d "$UDID"

      - if: matrix.target == 'macos'
        run: flutter test integration_test -d macos

      - if: matrix.target == 'windows'
        run: flutter test integration_test -d windows

      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev xvfb
          xvfb-run -a flutter test integration_test -d linux

      # A chromedriver for the Chrome already on the runner: flutter drive
      # starts that Chrome, so the two versions have to match.
      - if: matrix.target == 'web'
        uses: nanasess/setup-chromedriver@v2
      - if: matrix.target == 'web'
        run: |
          chromedriver --port=4444 &
          flutter drive --driver test_driver/integration_test.dart --target integration_test/skullet_test.dart -d web-server --browser-name chrome --headless

  build-example:
    name: Build example (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: web, os: ubuntu-latest, build: flutter build web }
          - { target: android, os: ubuntu-latest, build: flutter build apk --debug }
          - { target: linux, os: ubuntu-latest, build: flutter build linux }
          - { target: ios, os: macos-latest, build: flutter build ios --no-codesign --simulator }
          - { target: macos, os: macos-latest, build: flutter build macos }
          - { target: windows, os: windows-latest, build: flutter build windows }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - name: Build
        working-directory: example
        run: |
          flutter pub get
          ${{ matrix.build }}
