name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Format, analyze, test, publish dry-run, pana
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib example/test
      - run: flutter analyze
      - run: flutter test
      - name: Example
        working-directory: example
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - run: dart pub publish --dry-run
      - name: pana
        run: |
          sudo apt-get install -y webp
          dart pub global activate pana
          dart pub global run pana --no-warning --exit-code-threshold 20 .

  min-flutter:
    name: Tests on the oldest supported Flutter (3.32.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.0
          channel: stable
      - run: flutter pub get
      - run: flutter test --exclude-tags golden

  tests:
    name: Tests on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Golden files are rendered on Linux; pixels differ slightly elsewhere.
      - run: flutter test --exclude-tags golden

  build-example:
    name: Build example (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: web, os: ubuntu-latest, build: flutter build web }
          - { target: android, os: ubuntu-latest, build: flutter build apk --debug }
          - { target: linux, os: ubuntu-latest, build: flutter build linux }
          - { target: ios, os: macos-latest, build: flutter build ios --no-codesign --simulator }
          - { target: macos, os: macos-latest, build: flutter build macos }
          - { target: windows, os: windows-latest, build: flutter build windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - name: Build
        working-directory: example
        run: |
          flutter pub get
          ${{ matrix.build }}
