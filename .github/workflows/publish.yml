name: Publish to pub.dev

# Publishes when a version tag such as v0.2.0 is pushed, with pub.dev's
# automated publishing: no token is stored here. Before the first run, turn
# it on at pub.dev > skullet > Admin > Automated publishing: GitHub Actions,
# repository woogi-kang/skullet, tag pattern v{{version}}, environment
# pub.dev. pub.dev refuses a tag that doesn't match pubspec.yaml's version.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Sets up the OIDC token pub.dev accepts in place of a stored one.
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test --exclude-tags golden
      - run: flutter pub publish --dry-run
      - run: flutter pub publish --force
